<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Segra</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="popup">
    <header class="bar">
      <img src="icons/32.png" alt="" width="20" height="20" />
      <span class="brand" data-i18n="appName"></span>
      <span id="dot" class="dot" title=""></span>
    </header>
    <main>
      <label>
        <span data-i18n="popupPort"></span>
        <input id="port" type="number" min="1024" max="65535" step="1" />
      </label>
      <label>
        <span data-i18n="popupToken"></span>
        <input id="token" class="token" type="text" spellcheck="false" autocomplete="off" />
      </label>
      <div class="row">
        <button id="save" class="primary" data-i18n="popupSave"></button>
        <button id="test" data-i18n="popupTest"></button>
      </div>
      <p id="status" class="status" role="status"></p>

      <hr />

      <label class="switch">
        <input id="intercept" type="checkbox" />
        <span data-i18n="popupIntercept"></span>
      </label>
      <p class="hint" data-i18n="popupInterceptHint"></p>
    </main>
    <footer>
      <span id="server" class="muted"></span>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
